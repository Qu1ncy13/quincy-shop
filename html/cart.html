<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link href="../css/style.css" rel = "stylesheet">
    <link href = "../css/cartStyle.css" rel="stylesheet">
    <link href="../images/icon_noBG.ico" rel="icon">
</head>
<body>
    <header>
        <div class="container header-inner">  
        <a href="../index.html"> <img src="../images/logo_noBG.png" alt="Quincy Shop" class="logo"></a>

        <nav>
            <ul class="menu">
                <li><a href="catalog.html" class="menu-btn">Каталог</a></li>
                <li><a href="contacts.html" class="menu-btn">Контакты</a></li>
                <li><a href="cart.html" class="menu-btn">Корзина</a></li>
                <li><a href="favorites.html" class="menu-btn">Избранное</a></li>
            </ul>
        </nav>
        
        <a href="../index.html" class = "btn"> Вернуться на главную</a>
        </div>
    </header>

    <main>
        <section class="cart">
            <div class="container cart-inner1">
                <div class="cart-text">
                    <h1>Корзина</h1>
                </div>
                <div class="cart-items"> 
                    
                    
                    
                </div>
                <div class="empty-cart hidden">
                        <h2>Нет добавленных товаров</h2>
                        <a href="catalog.html" class="btn" style="width: 100%;">Перейти в каталог</a>
                </div>
                
                
                

            </div>
            <div class="container cart-inner2">
                <div class="container">
                    <div class="code">
                        <div class="input-code">
                            <label for="code"> Введите промокод</label>
                            <input type="text" name="code" id="code">
                        </div>
                        
                        <button class="btn">Активировать</button>
                    </div>
                </div>
                <div class="container cart-total">
                    <div class="sum-wrapper">
                        <h2>Итого:</h2>
                        <h2 class="total-sum">$ 0</h2>
                    </div>
                    <div class="total-btn">
                        <button class="btn" style="font-size: 18px; width: 100%;">Оформить заказ</button>
                    </div>
                    
                </div>
            </div>
        </section>
        <div class="overlay hidden">
            <div class="clean-confirm-block">
                <h2>Вы точно хотите удалить содержимое корзины?</h2>
                <div class="clean-confirm-btn-block">
                    <button class="confirm-btn btn">Подтвердить</button>
                    <button class = "cancel-btn">Отмена</button>
                </div>
                
            </div>
        </div>
        
    </main>
    <script src="../js/cart.js"></script>
</body>
</html>
